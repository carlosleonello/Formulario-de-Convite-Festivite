<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Convite | Festivite</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <aside>
        <img src="assets/Logo.svg" alt="logo" />
        <h1 class="name">Festivite</h1>
        <p>Crie um convite digital para o seu evento</p>
      </aside>

      <main>
        <h2>Crie seu convite</h2>

        <form>
          <fieldset>
            <legend>
              <img src="assets/icons/calendar.svg" alt="calendario" />Sobre o
              evento
            </legend>

            <div class="input-wrapper">
              <label for="event-title">Título</label>
              <input
                type="text"
                id="event-title"
                name="title"
                placeholder="Nome do evento"
              />
            </div>

            <div class="form-row">
              <div class="input-wrapper">
                <label for="event-start">Início</label>
                <input type="datetime-local" id="event-start" name="start" />
              </div>

              <div class="input-wrapper">
                <label for="event-end">Fim</label>
                <input type="datetime-local" id="event-end" name="end" />
              </div>
            </div>

            <div class="form-row">
              <fieldset class="type-field">
                <legend>Tipo</legend>

                <div class="type-options">
                  <label class="type-option">
                    <input
                      type="radio"
                      name="event-type"
                      value="presencial"
                      checked
                    />
                    <span>Presencial</span>
                  </label>

                  <label class="type-option">
                    <input type="radio" name="event-type" value="online" />
                    <span>Online</span>
                  </label>
                </div>
              </fieldset>

              <div class="input-wrapper">
                <label for="event-location">Local</label>
                <input
                  type="text"
                  id="event-location"
                  name="location"
                  placeholder="Link ou endereço"
                />
              </div>
            </div>

            <div class="input-wrapper description-field">
              <label for="event-description">Descrição</label>
              <textarea
                id="event-description"
                name="description"
                placeholder="Escreva sobre os detalhes do evento"
              ></textarea>
            </div>
          </fieldset>

          <fieldset class="personalization">
            <legend>
              <img
                src="assets/icons/paintbrush-vertical.svg"
                alt=""
              />Personalização
            </legend>

            <fieldset class="color-field">
              <legend>Cor principal</legend>

              <div class="color-options">
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#59B2FF"
                  aria-label="Azul"
                  style="--swatch-color: var(--brand-light)"
                  checked
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#6A59FF"
                  aria-label="Roxo"
                  style="--swatch-color: #6a59ff"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#B259FF"
                  aria-label="Roxo claro"
                  style="--swatch-color: #b259ff"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#FF59F9"
                  aria-label="Fúcsia"
                  style="--swatch-color: #ff59f9"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#FF598B"
                  aria-label="Rosa"
                  style="--swatch-color: #ff598b"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#FF5959"
                  aria-label="Vermelho"
                  style="--swatch-color: var(--danger)"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#FF8B59"
                  aria-label="Laranja"
                  style="--swatch-color: #ff8b59"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#FFCD59"
                  aria-label="Amarelo"
                  style="--swatch-color: #ffcd59"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#E1FF59"
                  aria-label="Lima"
                  style="--swatch-color: #e1ff59"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#59FF91"
                  aria-label="Verde"
                  style="--swatch-color: #59ff91"
                />
                <input
                  type="radio"
                  class="color-option"
                  name="main-color"
                  value="#59FFF9"
                  aria-label="Ciano"
                  style="--swatch-color: #59fff9"
                />
              </div>
            </fieldset>

            <fieldset class="theme-field">
              <legend>Tema do evento</legend>

              <div class="theme-options">
                <label class="theme-option">
                  <input
                    type="radio"
                    name="event-theme"
                    value="aniversario"
                    checked
                  />

                  <span class="theme-card">
                    <img src="assets/themes/aniversario.svg" alt="" />
                    <span>Aniversário</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="infantil" />

                  <span class="theme-card">
                    <img src="assets/themes/infantil.svg" alt="" />
                    <span>Infantil</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="formatura" />

                  <span class="theme-card">
                    <img src="assets/themes/formatura.svg" alt="" />
                    <span>Formatura</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="casamento" />

                  <span class="theme-card">
                    <img src="assets/themes/casamento.svg" alt="" />
                    <span>Casamento</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="cha-de-bebe" />

                  <span class="theme-card">
                    <img src="assets/themes/cha-de-bebe.svg" alt="" />
                    <span>Chá de bebê</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input
                    type="radio"
                    name="event-theme"
                    value="cha-de-panela"
                  />

                  <span class="theme-card">
                    <img src="assets/themes/cha-de-panela.svg" alt="" />
                    <span>Chá de panela</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="carnaval" />

                  <span class="theme-card">
                    <img src="assets/themes/carnaval.svg" alt="" />
                    <span>Carnaval</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="pascoa" />

                  <span class="theme-card">
                    <img src="assets/themes/pascoa.svg" alt="" />
                    <span>Páscoa</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="sao-joao" />

                  <span class="theme-card">
                    <img src="assets/themes/sao-joao.svg" alt="" />
                    <span>São João</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="halloween" />

                  <span class="theme-card">
                    <img src="assets/themes/halloween.svg" alt="" />
                    <span>Halloween</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="natal" />

                  <span class="theme-card">
                    <img src="assets/themes/natal.svg" alt="" />
                    <span>Natal</span>
                  </span>
                </label>

                <label class="theme-option">
                  <input type="radio" name="event-theme" value="outros" />

                  <span class="theme-card">
                    <img src="assets/themes/outro.svg" alt="" />
                    <span>Outro</span>
                  </span>
                </label>
              </div>
            </fieldset>

            <div class="personalization-row">
              <fieldset class="style-field">
                <legend>Estilo</legend>

                <label class="style-switch">
                  <input
                    type="checkbox"
                    name="light-style"
                    value="light"
                    aria-label="Usar estilo claro"
                  />

                  <span class="switch-track" aria-hidden="true"></span>
                  <span class="style-name" aria-hidden="true"></span>
                </label>
              </fieldset>

              <div class="input-wrapper cover-field">
                <label for="cover-image">Foto de capa</label>

                <div class="upload-wrapper">
                  <label for="cover-image" class="upload-button">
                    Selecionar
                  </label>

                  <input
                    type="file"
                    id="cover-image"
                    name="cover-image"
                    accept="image/*"
                  />
                </div>
              </div>
            </div>
          </fieldset>

          <fieldset class="contact-fields">
            <legend>
              <img src="assets/icons/contact.svg" alt="" />Dados para contato</legend>

            <div class="input-wrapper">
              <label for="contact-name">Nome</label>
              <input type="text" id="contact-name" name="full-name" placeholder="Nome completo" autocomplete="name" aria-describedby="name-error" required/>

              <small class="field-error" id="name-error">
                Campo obrigatório</small>
            </div>

            <div class="form-row">
              <div class="input-wrapper">
                <label for="contact-email">E-mail</label>
                <input type="email" id="contact-email" name="email" placeholder="exemplo@email.com" autocomplete="email"/>
              </div>

              <div class="input-wrapper">
                <label for="contact-phone">Telefone</label>
                <input type="tel" id="contact-phone" name="phone" placeholder="(99) 99999-9999" autocomplete="tel" inputmode="numeric" oninput="this.value = this.value.replace(/\D/g, '')"/>
              </div>
            </div>
          </fieldset>

          <hr class="form-divider"/>
        </form>
      </main>
    </div>
  </body>
</html>
