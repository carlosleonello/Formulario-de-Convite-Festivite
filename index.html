<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Convite | Festivite</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <aside>
        <img src="assets/Logo.svg" alt="logo" />
        <h1 class="name">Festivite</h1>
        <p>Crie um convite digital para o seu evento</p>
      </aside>

      <main>
        <h2>Crie seu convite</h2>

        <form>
          <fieldset>
            <legend>
              <img src="assets/icons/calendar.svg" alt="calendario" />Sobre o evento
            </legend>

            <div class="input-wrapper">
              <label for="event-title">Título</label>
              <input type="text" id="event-title" name="title" placeholder="Nome do evento"/>
            </div>

            <div class="form-row">
              <div class="input-wrapper">
                <label for="event-start">Início</label>
                <input type="datetime-local" id="event-start" name="start" />
              </div>

              <div class="input-wrapper">
                <label for="event-end">Fim</label>
                <input type="datetime-local" id="event-end" name="end" />
              </div>
            </div>

            <div class="form-row">
              <fieldset class="type-field">
                <legend>Tipo</legend>

                <div class="type-options">
                  <label class="type-option">
                    <input type="radio" name="event-type" value="presencial" checked/>
                    <span>Presencial</span>
                  </label>

                  <label class="type-option">
                    <input type="radio" name="event-type" value="online" />
                    <span>Online</span>
                  </label>
                </div>
              </fieldset>

              <div class="input-wrapper">
                <label for="event-location">Local</label>
                <input type="text" id="event-location" name="location" placeholder="Link ou endereço"/>
              </div>
            </div>

            <div class="input-wrapper description-field">
              <label for="event-description">Descrição</label>
              <textarea id="event-description" name="description" placeholder="Escreva sobre os detalhes do evento"></textarea>
            </div>
          </fieldset>

          <fieldset class="personalization">
            <legend>
                <img src="assets/icons/paintbrush-vertical.svg" alt="">Personalização
            </legend>

            <fieldset class="color-field">
                <legend>Cor principal</legend>

                <div class="color-options">
                    <input type="radio" class="color-option" name="main-color" value="#59B2FF" aria-label="Azul" style="--swatch-color: var(--brand-light)" checked>
                    <input type="radio" class="color-option" name="main-color" value="#6A59FF" aria-label="Roxo" style="--swatch-color: #6A59FF">
                    <input type="radio" class="color-option" name="main-color" value="#B259FF" aria-label="Roxo claro" style="--swatch-color: #B259FF">
                    <input type="radio" class="color-option" name="main-color" value="#FF59F9" aria-label="Fúcsia" style="--swatch-color: #FF59F9">
                    <input type="radio" class="color-option" name="main-color" value="#FF598B" aria-label="Rosa" style="--swatch-color: #FF598B">
                    <input type="radio" class="color-option" name="main-color" value="#FF5959" aria-label="Vermelho" style="--swatch-color: var(--danger)">
                    <input type="radio" class="color-option" name="main-color" value="#FF8B59" aria-label="Laranja" style="--swatch-color: #FF8B59">
                    <input type="radio" class="color-option" name="main-color" value="#FFCD59" aria-label="Amarelo" style="--swatch-color: #FFCD59">
                    <input type="radio" class="color-option" name="main-color" value="#E1FF59" aria-label="Lima" style="--swatch-color: #E1FF59">
                    <input type="radio" class="color-option" name="main-color" value="#59FF91" aria-label="Verde" style="--swatch-color: #59FF91">
                    <input type="radio" class="color-option" name="main-color" value="#59FFF9" aria-label="Ciano" style="--swatch-color: #59FFF9">
                </div>
            </fieldset>
          </fieldset>
        </form>
      </main>
    </div>
  </body>
</html>
